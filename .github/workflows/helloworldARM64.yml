name: Build ARM64 and Push to Docker Hub

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm  # Native ARM64 GitHub-hosted runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push users-service ARM64 image
        run: |
          docker build -t rencecaringal000/helloworldarm64:latest .
          docker push rencecaringal000/helloworldarm64:latest

      - name: Build and Push nginx-proxy ARM64 image
        run: |
          docker build -t rencecaringal000/helloworldproxy:latest ./proxy
          docker push rencecaringal000/helloworldproxy:latest